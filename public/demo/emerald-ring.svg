<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1d1a17"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af6a"/>
      <stop offset="50%" stop-color="#f0d9a3"/>
      <stop offset="100%" stop-color="#b8934a"/>
    </linearGradient>
    <radialGradient id="emerald" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3fd6a0"/>
      <stop offset="60%" stop-color="#12b37a"/>
      <stop offset="100%" stop-color="#0a5c3d"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="500" r="160" fill="url(#gold)" opacity="0.06" filter="url(#soft)"/>
  <circle cx="600" cy="560" r="210" fill="none" stroke="url(#gold)" stroke-width="34"/>
  <circle cx="600" cy="560" r="210" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.35" transform="scale(1.14) translate(600,560) translate(-600,-560)"/>
  <ellipse cx="600" cy="470" rx="90" ry="70" fill="url(#emerald)"/>
  <ellipse cx="600" cy="470" rx="90" ry="70" fill="none" stroke="#eafff4" stroke-width="6" opacity="0.85"/>
  <text x="600" y="830" text-anchor="middle" fill="#d4af6a" font-family="Georgia, 'Times New Roman', serif" font-size="40" letter-spacing="14" opacity="0.9">DEMO</text>
  <text x="600" y="880" text-anchor="middle" fill="#9a9287" font-family="Verdana, sans-serif" font-size="20" letter-spacing="6">ESMERALDAS GOLD</text>
</svg>